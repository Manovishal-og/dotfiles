########## ⚙️ BASIC CONFIGURATION ##########
# Use C-s as the prefix
set-option -g prefix C-s
unbind C-b
bind C-s send-prefix

# Reload config
unbind s
bind-key s source-file ~/.tmux.conf \; display-message "🔥 CYBERPUNK MODE ACTIVATED 🔥"

# Rename window & session
unbind ,
unbind $
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# Create new window
unbind c
bind a new-window

# Kill controls
unbind &
unbind x
unbind q
bind q kill-pane
bind Q kill-window
bind C-q kill-session

# Enable mouse support
set -g mouse on

# Vim keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Disable window auto-rename
set -g allow-rename off

########## 🔀 NAVIGATION ##########

# Shift + Arrow for window switch
bind -n S-left previous-window
bind -n S-right next-window

# Alt + Arrow for pane switch
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# v/h to split panes
unbind '"'
unbind %
bind v split-window -h
bind h split-window -v

########## 🎨 CYBERPUNK STATUS BAR THEME ##########

# Set status bar at top
set -g status-position top
set -g status-style bg='#18201e',fg='#00ffff'
set -g status-interval 1
set -g status-justify centre

### Pane Borders
set -g pane-border-style fg='#242e2c'
set -g pane-active-border-style fg='#00ffff'

### Window Tabs
setw -g window-status-format '#[fg=#000000,bg=#18201e]#[fg=#00ffff,bg=#000000] #W#[fg=#000000,bg=#18201e]'
setw -g window-status-current-format '#[fg=#00ffff,bg=#18201e]#[fg=#000000,bg=#00ffff] #W#[fg=#00ffff,bg=#18201e]'
setw -g window-status-style bg='#18201e',fg='#00ffff'
setw -g window-status-current-style bg='#c2a97e',fg='#18201e'
setw -g window-status-separator ' '

### Status Left
set -g status-left '#[fg=#000000,bg=#18201e]#[fg=#00ffff,bg=#000000]  tmux#[fg=#000000,bg=#18201e] '

### Status Right
set -g status-right ' #[bg=#18201e,fg=#000000]#[bg=#000000,fg=#00ffff]󰥔  #(uptime -p)#[bg=#18201e,fg=#000000]'

### Cleanup spacing
set -g status-left-length 80
set -g status-right-length 100

### Message Styling
set -g message-style bg='#070707',fg='#00ffff'

########## 🔌 PLUGIN MANAGER ##########

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'

# Let TERM updates pass through
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Initialize TPM (always at the end)
run '~/.tmux/plugins/tpm/tpm'
