
[pyprland]
plugins = ["scratchpads", "magnify"]

[scratchpads.network]
command = "kitty --class scratchpad -e ranger"
animation = "fromRight"
position = "50% 0%"
class = "kitty"
size = "10% 10%"
unfocus = "hide"


[scratchpads.volume]
animation = "fromTop"
command = "pavucontrol"
class = "org.pulseaudio.pavucontrol"
size = "50% 30%"
position = "50% 5%"
unfocus = "hide"
