# ─────────────────────────────
#  CYAN CYBERPUNK HYPRLOCK
# ─────────────────────────────

# ── Disable wal overrides (optional)
# source = /home/zamipter/.cache/wal/colors-hyprland.conf

# ── BACKGROUND ────────────────
background {
    path = /home/zamipter/Pictures/Wallpaper/cyberpunk/wallhaven-z8mg6g_1366x768.png
    blur_passes = 1
    contrast = 1.2
    brightness = 0.4
    vibrancy = 0.5
    vibrancy_darkness = 0.25
}

# ── GENERAL ───────────────────
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# ── INPUT FIELD ───────────────
input-field {
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.4
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 255, 255, 0.25)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(0, 255, 255)
    font_family = IBM Plex Mono
    fade_on_empty = false
    rounding = 10
    check_color = rgb(0, 255, 200)
    placeholder_text =
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# ── TIME ──────────────────────
label {
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgb(0, 255, 255)
    font_size = 95
    font_family = Espacion ExtraBold
    position = 0, 50
    halign = center
    valign = center
}

# ── DATE ──────────────────────
label {
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(0, 255, 255, 0.7)
    font_size = 24
    font_family = Valorant
    position = 0, 150
    halign = center
    valign = center
}


# ── GREETING ──────────────────
label {
    text =  Enter Code
    color = rgb(0, 255, 255)
    font_size = 18
    font_family = Valorant
    position = 0, -150
    halign = center
    valign = center
}
